name: TikTok to YouTube Shorts Sync

on:
  schedule:
    # Daily at 5:00 PM PKT (12:00 PM UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & Browser Impersonator
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib requests "yt-dlp[default,curl-cffi]"

      - name: Run TikTok Shorts Uploader
        run: |
          python uploader.py

      - name: Commit Tracker State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f uploaded_shorts.json ]; then
            git add uploaded_shorts.json
            git commit -m "Update uploaded shorts state" || echo "No changes to commit"
            git push
          fi
